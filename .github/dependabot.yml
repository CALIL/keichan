# Dependabot 設定
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# 既存設定は open-pull-requests-limit: 0 でバージョン更新を止めていた。
# PR が乱立するのを避けるための措置だったが、minor/patch をグループ化すれば
# 本数は抑えられるため、上限を設けたうえで更新を再開する。
# 今回あらたに対象へ追加するエコシステム: github-actions
#
# 方針: minor/patch はグループ化して 1 PR にまとめ、major は個別 PR で判断する。
#       リリース直後の不具合や yank を踏まないよう cooldown で寝かせてから PR を出す。

version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # react のメジャー更新は周辺ライブラリの対応状況をまとめて確認してから
      # 手動で判断する。詳細は Todoist を参照
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # @types/node のメジャーは Node.js 本体のメジャーに対応しているので、
      # ビルドに使う Node.js（.nvmrc = 24）より先に上げてはいけない。
      # 上げると新しい Node.js で追加された API を tsc が通してしまい、
      # 本番で初めて落ちる。
      # Node.js を上げるときに .nvmrc と一緒に手で上げる。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions (.github/workflows)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
